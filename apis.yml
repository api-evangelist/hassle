name: Hassle
description: 'Hassle.com was a London-based on-demand home-cleaning marketplace, founded in 2012 by Alex
  Depledge and Jules Coleman, connecting households with vetted local cleaners for one-off and recurring
  bookings. Backed by Accel Partners, it was acquired by Rocket Internet-backed Helpling in July 2015 for
  a reported EUR 32 million to form one of the world''s largest home-cleaning marketplaces. The Hassle.com
  brand was subsequently folded into Helpling, whose UK operations have since ceased; the domain now
  redirects to Helpling. The company operates a consumer-facing web/mobile booking product and exposes no
  public developer API, SDK, or documentation surface.'
